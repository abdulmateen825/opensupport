[project]
name = "opensupport-backend"
version = "0.1.0"
description = "FastAPI backend for OpenSupport"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "celery[redis]>=5.4,<6.0",
    "qdrant-client>=1.12,<2.0",
    "httpx>=0.28,<1.0",
    "boto3>=1.35,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.1,<6.0",
    "cryptography>=43,<46",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
