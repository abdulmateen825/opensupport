name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t opensupport-ci-backend:local .
      - run: python3 scripts/smoke_backend_container.py --image opensupport-ci-backend:local

  backend-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check backend/app backend/alembic backend/tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/check_deployment.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:shopping
      - run: pnpm build
      - run: node --test apps/widget/tests/capabilities.smoke.mjs
