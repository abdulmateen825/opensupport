services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opensupport
      POSTGRES_USER: opensupport
      POSTGRES_PASSWORD: opensupport
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  rustfs:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: opensupport
      RUSTFS_SECRET_KEY: change-me-now
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: ["rustfs_data:/data"]

  ingestion-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uv", "run", "celery", "-A", "backend.app.workers.celery_app.celery_app", "worker", "--beat", "--loglevel=INFO"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://opensupport:opensupport@postgres:5432/opensupport
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_ACCESS_KEY_ID: opensupport
      S3_SECRET_ACCESS_KEY: change-me-now
      S3_BUCKET: opensupport
    depends_on:
      - postgres
      - redis
      - qdrant
      - rustfs

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  rustfs_data:
